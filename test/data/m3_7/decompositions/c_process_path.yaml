# M3_DESIGN §19 C -- a CNC-LIKE PROCESS PATH, as a Canonical Task Program (a generation test, never
# shipped). Dispensing, gluing and sealing are the same with their channel. The design's dense source
# is a FILE; a file source is a later TSA form (KNOWN_DEBT), so the dense path here is one of TMR's
# generators -- the same dense path, the same provider (cartesian_waypoints, continuous_path).
# Merged into the M3.7 composition cell (test_m3_7_decompositions.py).
application:
  type: task_program
  motion_profiles:
    transit: {speed: 50, acceleration: 50}
    approach: {speed: 20, acceleration: 20}
    process: {speed: 10, acceleration: 10}
  waypoints:                   # base_link, tool down
    - {name: home, type: joint, named: home}
    - {name: approach, position: [0.45, 0.0, 0.25], orientation: [1.0, 0.0, 0.0, 0.0]}
    - {name: start, position: [0.4, 0.0, 0.12], orientation: [1.0, 0.0, 0.0, 0.0]}
    - {name: retract, position: [0.4, 0.0, 0.25], orientation: [1.0, 0.0, 0.0, 0.0]}
  paths:
    - name: contour
      source:
        generator: {type: polyline, points: [[0.4, 0.0, 0.12], [0.5, 0.0, 0.12], [0.5, 0.1, 0.12],
                                             [0.4, 0.1, 0.12]], closed: true}
        orientation: [1.0, 0.0, 0.0, 0.0]
      continuity: blend          # through the samples: a continuous path
      profile: process
      provider: cartesian_waypoints
  tasks:
    - name: machine_contour
      steps:
        - move: {to: approach, type: ptp, profile: transit}
        - move: {to: start, type: lin, profile: approach}
        - process: {kind: process_on, channel: spindle}
        - path: contour
        - process: {kind: process_off, channel: spindle}
        - move: {to: retract, type: lin, profile: approach}
        - move: {to: home, type: ptp, profile: transit}
  main_task: machine_contour
