# External candidate providers (vNext M1). Curated from the vNext review research; see
# provenance. Edit by hand, never by assumption: every licence claim keeps its source.
candidates_version: 1
provenance:
  what: External candidate providers -- METADATA ONLY. Nothing here is installed, configured or benchmarked
    by TrainIt (vNext approval, 2026-10-06).
  researched: 'vNext architecture review, 2026-10-06: 20 technologies read at tag-pinned repositories,
    package.xml files, LICENSE files and NGC model cards; 92 claims re-checked (69 confirmed, 18 corrected,
    5 unverifiable). The texts below are the corrected findings, verbatim.'
  status_rule: VERIFIED = read at the exact source; REQUIRES_REVIEW = sources conflict or a legal reading
    is needed; UNKNOWN = not found or not stated. Never upgraded by assumption.
  cross_cutting:
  - 'Every Apache-2.0 Isaac ROS wrapper depends on isaac_ros_common / NITROS, under the NVIDIA Isaac ROS
    Software License (NVIDIA GPUs only, distribution conditions): no NVIDIA provider can be a Community
    dependency (ADR-0003).'
  - 'Isaac ROS Software License section 4g: not tested or certified for safety-critical systems.'
  - Isaac ROS 3.2 (update 15, tag v3.2-15, 2025-12-10) is the LAST Humble release; 4.x targets Jazzy /
    Ubuntu 24.04, 5.0 Lyrical. ROS 2 Humble reaches end of life in May 2027.
candidates:
