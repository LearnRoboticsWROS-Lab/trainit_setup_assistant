  - suction
  - parallel
  - composite
  provides:
  - binary_actuation
  - actuation_feedback
  - gripper_control
  - position_control
  - effort_control
  - joint_position_control
  - trajectory_control
  - grasp_detection
  - release_detection
  - continuous_state
  provides_if: {}
  evidence_classes:
  - sensor
  - sim_ground_truth
  - actuation_inference
  evidence_configurable: true
  package: trainit_hardware_layer
  executable: mock_eef_adapter
  since: 0.2.0
  maturity: development
  evidence: 'ADR-0022 D8: serves every actuator on its standard interface at the canonical names; every
    capability and the evidence class are configurable by node parameters'
- id: adapter.eef.trainit_isaac_surface_gripper
  adapter_type: eef
  name: TrainIt Isaac SurfaceGripper adapter
  modes:
  - isaac
  serves:
  - set_bool
  kinds:
  - suction
  provides:
  - binary_actuation
  - continuous_state
