  modes:
  - real
  maturity: non_production_ready
  evidence: 'vNext M0D T4: as generated, mode:=real starts no hardware interface; the FAIRINO bridge executes
    only a trajectory''s last waypoint (R0); never run end to end (owner classification DEVELOPMENT /
    NON-PRODUCTION-READY)'
