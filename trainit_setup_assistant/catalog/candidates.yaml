    2.5.8 in 3.2 Update 5). Isaac ROS 4.0-4.3 (2025-10 to 2026-03) target Jazzy on Ubuntu 24.04 and keep
    the cuRobo isaac-4.0 backend. Neither release-4 nor release-4.6 has a jammy apt repo (HTTP 404).'
  requirements:
