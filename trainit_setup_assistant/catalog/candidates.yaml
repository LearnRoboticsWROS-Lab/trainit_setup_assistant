  family: motion_planning
  kind: candidate
  integration: moveit_pipeline
  packages: [isaac_ros_cumotion, isaac_ros_cumotion_moveit, curobo_core]
  name: 'cuMotion: Isaac ROS 3.2 Humble line (isaac_ros_cumotion, isaac_ros_cumotion_moveit, curobo_core
    on cuRobo v1); same backend in Jazzy 4.0-4.3'
  vendor: NVIDIA
  distribution: external
  trainit_class: pro_candidate
  installed: false
  configured: false
  benchmarked: false
  license_status: VERIFIED
  licence_clauses:
  - NVIDIA Isaac ROS Software License (2021-11-17)
  - 'cuRobo v1 NVIDIA License section 3.3: research or evaluation only'
  dependency: 'cuRobo v1 (curobo_core submodule): NVIDIA License section 3.3'
  evaluation_use: allowed
  commercial_use: not_allowed
  humble_available: true
  code_license: 'The repo LICENSE (v3.2-15) and the isaac_ros_cumotion and curobo_core package.xml files
    use the NVIDIA Isaac ROS Software License (v. 2021-11-17). It is proprietary: it permits install/use,
    modification of sample or reference source, and distribution either inside an application or as an
    unmodified binary, only for applications on NVIDIA-GPU systems, and never in a copyleft combination.
    isaac_ros_cumotion_moveit is Apache-2.0. The vendored cuRobo (branches isaac-3.2 and isaac-4.0) is
    under the NVIDIA License, whose section 3.3 says it ''only may be used or intended for use non-commercially
    ... research or evaluation purposes only''.'
  weights_license: 'N/A: an optimisation-based planner with no learned weights.'
  redistribution: cuRobo may only be redistributed under the same NVIDIA License with a full copy of it
    and the original notices; derivative works must keep the section 3.3 limit. The Isaac ROS-licensed
    parts may only be distributed inside an application with material additional functionality, or as
    an unmodified binary, under terms at least as protective. Neither may go into a Community bundle (ADR-0003).
  evaluation_vs_commercial: 'VERIFIED: ADR-0015''s premise still holds for every Humble release (3.2 through
    3.2-15) and for 4.0-4.3, because the backend is cuRobo v1 with the section 3.3 limit. The terms EXPLICITLY
    ALLOW research or evaluation use, so benchmarking cuMotion against OMPL/Pilz in the lab is allowed.
    Commercial deployment (a paying customer or a production cell) is NOT allowed. The Isaac ROS licence
    on the wrapper does not lift the cuRobo restriction.'
  os_ros_support: 'Isaac ROS 3.0, 3.1 and 3.2 target ROS 2 Humble on Ubuntu 22.04 / JetPack 6. The LAST
    Humble release is Isaac ROS 3.2 Update 15 (tag v3.2-15, 2025-12-10); no 3.2 update is listed after
