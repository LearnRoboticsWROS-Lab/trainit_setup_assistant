    stage_status_topic:
    - grasp_detection
    - release_detection
  evidence_classes:
  - sim_ground_truth
  evidence_configurable: false
  package: trainit_hardware_layer
  executable: isaac_eef_adapter
  since: 0.2.0
  maturity: development
  evidence: 'ADR-0022 D8 and EEF-D5: binary suction only; a grasp is observed only with the stage status
    topic, never inferred from the command echo'
- id: adapter.eef.ros2_control
  adapter_type: eef
  name: ros2_control GripperActionController (third-party)
  modes:
  - gazebo
  - real
  serves:
  - gripper_command
  kinds:
  - parallel
  - composite
  provides:
  - gripper_control
  - position_control
  provides_if:
