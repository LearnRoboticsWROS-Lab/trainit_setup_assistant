    it can only be a Pro/optional provider, never a Community dependency (ADR-0003). CONFLICT: the current
    cuMotion concept page still says cuMotion ''leverages the cuRobo library internally'', while the 4.6
    release notes say the backend switched away from cuRobo and the cuMotion NOTICE lists no cuRobo. REQUIRES_REVIEW
